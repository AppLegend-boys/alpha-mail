# GitHub 는 기본 브랜치(main)에 병합될 때만 `Closes #N` 이슈를 닫는다. 기능 PR 은 dev 로 가므로 여기서 대신 닫는다.
name: 이슈 닫기

on:
  pull_request:
    types: [closed]
    branches: [dev]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: PR 본문의 Closes·Fixes·Resolves #N 이슈 닫기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }} # 본문을 셸에 직접 끼우지 않으려고 환경 변수로 넘긴다
        run: |
          for n in $(printf '%s' "$BODY" | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):? *#[0-9]+' | grep -oE '[0-9]+' | sort -un); do
            gh issue close "$n" --reason completed --comment "PR #$PR 이 dev 에 병합되어 닫았어요." || echo "#$n 은 닫지 못했어요(이미 닫혔거나 이슈가 아님)."
          done
